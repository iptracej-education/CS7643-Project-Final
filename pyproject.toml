[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs7643-project"
version = "0.0.0"
description = "CS7643 project code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "xgboost>=2.0",
    "rich>=13.7",
    "torch>=2.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = [
    "src",
    "src.*",
    "data",
]

[tool.setuptools.package-data]
data = ["UjiIndoorLoc/*.csv"]

